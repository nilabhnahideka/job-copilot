[project]
name = "job-copilot"
version = "0.3.0"
description = "LangGraph agent that tailors your job applications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0",
    # AI providers: Gemini (free tier) and OpenAI (paid), chosen with LLM_PROVIDER
    "langchain-google-genai>=4.0",
    "langchain-openai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    # database: Postgres driver, LangGraph's Postgres checkpointer, schema migrations
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=3.0",
    "alembic>=1.14",
    # accounts: Argon2 password hashing, login tokens, email validation
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
# Migration files are generated by Alembic; keep them as generated.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"evals/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
